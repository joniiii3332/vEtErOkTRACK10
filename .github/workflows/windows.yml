
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build EXE
        run: |
        pyinstaller --clean --noconfirm --onefile --windowed --name vEtErOkTRACK10 --add-data "music.mp3;." joniiiiii.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: vEtErOkTRACK10-Windows
          path: dist/vEtErOkTRACK10.exe
